name: ci

on:
  push:
    branches: [main]
    # A tag has to trigger the workflow, or the publish job below can never
    # run: its condition is `startsWith(github.ref, 'refs/tags/v')`, and a
    # workflow that only listens to `main` never sees a tag. That is how
    # 0.2.1 shipped - by hand - while the publish job sat in the file looking
    # like it worked.
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      # dist/ is committed, so test:all rebuilds before the tests that import it.
      # test:all is deliberately the offline subset: measure/attribute read the
      # install database and ~/.config/opencode, neither of which exists here.
      - run: npm run test:all
      - name: CLI smoke test
        run: |
          node bin/oc-harness.mjs list
          node bin/oc-harness.mjs show fleet-safe
          node bin/oc-harness.mjs use fleet-safe --print | tail -20
          # longcat publishes no effort levels: the loader omits `variant` for
          # every lane it serves. Assert the count is zero, not merely that the
          # word appears somewhere — an unmanaged key inherited from a dirty
          # local config once faked this check green.
          test "$(node bin/oc-harness.mjs use longcat-2.5-preview-free --print | grep -c '"variant"')" = "0"
          # A fleet puts ten different models behind ten lanes.
          test "$(node bin/oc-harness.mjs use fleet-all --print | grep -c '"model": "opencode/')" -ge "10"
      - name: install and verify into a scratch config dir
        run: |
          export OPENCODE_CONFIG_DIR="$RUNNER_TEMP/opencode-config"
          node bin/oc-harness.mjs use fleet-safe --yes
          node bin/oc-harness.mjs install
          node bin/oc-harness.mjs verify
          node bin/oc-harness.mjs agents
          # Reuses the same scratch config dir, so the config-drift check inside
          # doctor reads the config installed above instead of the runner's.
          node bin/oc-harness.mjs doctor

  publish:
    needs: test
    # Only on a tag. On every push to main the second run would fail with
    # EPUBLISHCONFLICT, because the version in package.json is already on the
    # registry — a broken build on every ordinary commit after the first.
    # Cutting a release: bump the version, update CHANGELOG.md, then
    #   git tag v0.3.0 && git push origin main v0.3.0
    # The tag is what triggers the publish; the release notes are the
    # CHANGELOG entry for that version.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for trusted publishing: npm exchanges the runner's OIDC
      # identity for a short-lived publish token, so there is no long-lived
      # secret in the repository to leak, rotate or expire.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          # Never cache the package manager in a release build: the cache is
          # keyed on the lockfile, and a stale one is a mystery in a publish.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later. Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - name: configure the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "registry=https://registry.npmjs.org/"
            if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
              echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}"
              echo "always-auth=true"
            fi
          } >> ~/.npmrc
      - run: npm ci --no-audit --no-fund
      # Two ways to publish, and the job picks the one that is available.
      #
      #   trusted publishing (OIDC)  - no secret at all. The package names
      #     this workflow on npmjs.com and npm trusts the runner's identity.
      #   a token                   - a granular token scoped to this one
      #     package, for the case where OIDC is not set up.
      #
      # The registry is configured by hand rather than through setup-node's
      # `registry-url`, because that helper always writes an auth line. An
      # empty auth line makes npm think it is authenticated and skip the OIDC
      # exchange entirely.
      - name: check the publish credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            # A token is present, so the token path. `npm whoami` is the only
            # check that works for a token scoped to one package:
            # `npm access list packages` needs account-level access to list a
            # user's packages, and a granular token is answered 403 for it.
            if ! npm whoami; then
              echo "::error::NPM_TOKEN is not a valid npm token. The publish job needs a token that can publish opencode-harness-kit."
              exit 1
            fi
            echo "publishing with a token"
          else
            # No token, so trusted publishing. `npm whoami` does NOT reflect
            # an OIDC identity - the exchange happens inside the publish - so
            # asking it here would fail a publish that would have worked.
            echo "no NPM_TOKEN: publishing through trusted publishing (OIDC)"
          fi
      # prepublishOnly rebuilds dist, so the install above is what provides
      # the esbuild binary it runs with.
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm swallows the reason a failed OIDC exchange was refused and
          # reports a bare ENEEDAUTH. The reason is logged at verbose level, so
          # the publish is run at verbose level and its own oidc lines are
          # pulled out of the log afterwards.
          npm_config_loglevel: verbose
        run: |
          set -uo pipefail
          # Provenance is generated automatically under trusted publishing, so
          # the flag is only needed on the token path.
          args=(--access public)
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            args+=(--provenance)
          fi
          # The runner runs every script with `bash -e`, so a failing npm
          # publish would exit before the log could be read. The `|| code=$?`
          # idiom is what keeps the reason available.
          code=0
          npm publish "${args[@]}" > /tmp/publish.log 2>&1 || code=$?
          grep -E "oidc|oidc/token|trust|ENOENT|E401|E403|E404|ENEEDAUTH|not authorized" /tmp/publish.log || true
          if [ $code -ne 0 ]; then
            echo "::error::npm publish failed (exit $code). With no NPM_TOKEN this is trusted publishing: check that npmjs.com lists this repository and workflow (ci.yml) as a trusted publisher, that the workflow name matches exactly, that the repository matches, and that the configuration has had its first successful publish within 2 days. With a token it is usually a token without WRITE access to the opencode-harness-kit package - npm answers 404 for a package the token cannot touch, which reads like a missing package."
            exit $code
          fi
