name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opencode: ["1.19.4", "2.1.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install OpenCode
        run: |
          if [ "${{ matrix.opencode }}" = "1.19.4" ]; then
            npm install -g opencode-ai@1.19.4
          else
            npm install -g @opencode/cli-linux-x64@2.1.4
          fi
      - run: npm run check
      - name: V2 gates
        if: startsWith(matrix.opencode, '2.')
        run: |
          export HOME="$RUNNER_TEMP/oc-home"
          mkdir -p "$HOME"
          npm run gate:v2
