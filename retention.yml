# Retention and privacy, stated by the person who uses the model.
#
# models.dev describes capability and price. It does NOT describe what a
# provider does with your prompts. That gap is why retention is a first-class
# field and why the package ships no model entries here: a privacy verdict is
# a statement about your account and your provider, not a default somebody
# else chose for you.
#
# When you create a profile, state the terms once:
#
#   oc-harness use <provider>/<model> --retention zero-retention|retained|may-train
#
# The verdict is recorded next to your profiles in
# `~/.config/opencode/retention.json`. Later commands read that file, so the
# answer stays visible in `oc-harness list` and in the generated config
# header. A profile whose terms nobody has stated is refused.
#
# Values, ordered safest-first:
#   zero-retention  provider keeps nothing, no training
#   retained        no training, but a stated retention window
#   may-train       prompts and/or completions may be used to improve the model
#   unknown         not verified here; `oc-harness use` refuses it
#
# A profile is only as private as its least private model, so a fleet that
# mixes these values is labelled with the worst one. A profile may also declare
# `maxRetention`, which is the ceiling its lanes are allowed to resolve to:
# every lane then takes the first rung of its model chain at or below that
# ceiling.
#
# This file is the package-level fallback. It deliberately carries no models.
# If you prefer to keep all verdicts in one reviewable file instead of the
# generated JSON, entries may be written under `models:` in the same shape as
# the user file; a model stated there is still a statement you made.

defaults:
  unknown: unknown

models: {}
