# Data retention and privacy, curated by hand.
#
# models.dev describes capability and price. It does NOT describe what a
# provider does with your prompts. That gap is why this file exists: the most
# consequential choice in a coding agent is often invisible in the metadata.
#
# Values, ordered safest-first:
#   zero-retention  provider keeps nothing, no training
#   retained        no training, but a stated retention window
#   may-train       prompts and/or completions may be used to improve the model
#   unknown         not verified here; `oc-harness use` refuses to make it a
#                   default until a human fills this in
#
# A profile is only as private as its least private model, so a fleet that
# mixes these values is labelled with the worst one. A fleet may also declare
# `maxRetention`, which is the ceiling its lanes are allowed to resolve to:
# every lane then takes the first rung of its model chain at or below that
# ceiling.
#
# Sources: https://opencode.ai/docs/zen (Free models + Privacy sections).
# Re-verify on their release notes; terms change without a model rename.

defaults:
  unknown: unknown

models:
  # --- Zero-retention: the provider states a zero-retention policy and does
  # not train on your data. ---

  opencode/minimax-m3.1-flash-free:
    retention: zero-retention
    note: >-
      "Its provider follows a zero-retention policy and does not use your data
      for model training." Free for a limited time.
    verified: 2026-10-19
    source: https://opencode.ai/docs/zen

  opencode/glm-5.3-flash-free:
    retention: zero-retention
    note: >-
      "Its provider follows a zero-retention policy and does not use your data
      for model training." Free for a limited time.
    verified: 2026-10-19
    source: https://opencode.ai/docs/zen

  opencode/deepseek-v4.1-flash-free:
    retention: zero-retention
    note: >-
      "Its provider follows a zero-retention policy and does not use your data
      for model training." Free for a limited time.
    verified: 2026-10-19
    source: https://opencode.ai/docs/zen

  opencode/longcat-2.5-preview-free:
    retention: zero-retention
    note: >-
      "Its provider follows a zero-retention policy and does not use your data
      for model training." Free for a limited time. A preview model: the
      endpoint can be withdrawn without a rename.
    verified: 2026-10-19
    source: https://opencode.ai/docs/zen

  # --- Retained: no training, but the provider keeps the data for a stated
  # window. Not the same promise as zero-retention, so it gets its own value. ---

  opencode/beam-free:
    retention: retained
    note: >-
      "Prompts and other inputs are not used for training. Data is retained
      for 30 days for safety reasons." Also unavailable in a list of sanctioned
      regions. Free for a limited time.
    verified: 2026-10-19
    source: https://opencode.ai/docs/zen

  # --- May-train: the provider may use the data to improve the model, or logs
  # the session. ---

  opencode/big-pickle:
    retention: may-train
    note: >-
      "During its free period, collected data may be used to improve the
      model." A stealth model with no public identity.
    verified: 2026-10-19
    source: https://opencode.ai/docs/zen

  opencode/mimo-v2.6-flash-free:
    retention: may-train
    note: >-
      "During its free period, collected data may be used to improve the
      model."
    verified: 2026-10-19
    source: https://opencode.ai/docs/zen

  opencode/nemotron-3-ultra-free:
    retention: may-train
    note: >-
      NVIDIA free trial endpoints. "Trial use only - do not submit personal or
      confidential data. Your use is logged for security purposes and to
      improve NVIDIA products and services."
    verified: 2026-10-19
    source: https://opencode.ai/docs/zen

  opencode/nemotron-3.5-lightning-free:
    retention: may-train
    note: >-
      NVIDIA free trial endpoints. "Trial use only - do not submit personal or
      confidential data. Your use is logged for security purposes and to
      improve NVIDIA products and services."
    verified: 2026-10-19
    source: https://opencode.ai/docs/zen

  opencode/nemotron-3.5-super-vl-free:
    retention: may-train
    note: >-
      NVIDIA free trial endpoints. "Trial use only - do not submit personal or
      confidential data. Your use is logged for security purposes and to
      improve NVIDIA products and services."
    verified: 2026-10-19
    source: https://opencode.ai/docs/zen

  # --- Paid routes, kept because the catalog still serves them and a profile
  # may be pointed at one. ---

  opencode/muse-spark-1.3:
    retention: may-train
    note: Same Meta contributor terms as the free variant.
    verified: 2026-10-19
    source: https://opencode.ai/docs/zen
